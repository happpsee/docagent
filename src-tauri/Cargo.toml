[package]
name = "docagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "docagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
sqlite-vec = "0.1"
zerocopy = "0.8"
uuid = { version = "1", features = ["v4"] }
libsqlite3-sys = "0.35"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
